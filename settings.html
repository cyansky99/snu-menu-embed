<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>식당 설정 · 서울대 식단</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=k15">
    <script src="assets/theme.js?v=christmas-30"></script>
    <link rel="stylesheet" href="assets/style.css?v=responsive-columns-32">
    <link rel="stylesheet" href="assets/settings.css?v=settings-copy-29">
    <link rel="stylesheet" href="assets/christmas.css?v=calligraphy-31">
    <script type="module" src="assets/app.js?v=responsive-columns-32"></script>
  </head>
  <body data-page="settings">
    <main class="widget" aria-label="서울대학교 식단">
      <div class="holiday-banner">
        <p class="holiday-title" lang="en">Merry Christmas</p>
      </div>
      <header class="heading">
        <div class="site-title">
          <h1>서울대 식단</h1>
          <a id="configuration-link" class="settings-link is-active" href="./index.html" aria-label="설정 닫고 식단으로 돌아가기" title="설정 닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4l1 3 2 1 3-1 2 4-2 2v2l2 2-2 4-3-1-2 1-1 3h-4l-1-3-2-1-3 1-2-4 2-2v-2L2 9l2-4 3 1 2-1z"/><circle cx="12" cy="12" r="3"/></svg>
          </a>
        </div>
        <nav class="meal-navigation" aria-label="테마 선택">
          <button id="previous-meal" class="meal-arrow" type="button" aria-label="이전 테마" aria-controls="context" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 4-4 4 4 4"/></svg>
          </button>
          <p id="context" aria-live="polite" aria-atomic="true"></p>
          <button id="next-meal" class="meal-arrow" type="button" aria-label="다음 테마" aria-controls="context" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg>
          </button>
        </nav>
      </header>
      <div class="settings-url-notice">
        <div class="settings-url-row">
          <span>설정은 URL에 저장됩니다</span>
          <button id="copy-menu-url" class="copy-menu-url" type="button" aria-label="설정된 식단 주소 복사" title="식단 주소 복사">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17H7a5 5 0 0 1 0-10h2m6 0h2a5 5 0 0 1 0 10h-2M8 12h8"/></svg>
          </button>
          <span id="copy-url-feedback" class="copy-url-feedback" role="status" aria-live="polite"></span>
        </div>
        <input id="copy-url-fallback" class="copy-url-fallback" type="text" aria-label="직접 복사할 식단 주소" readonly hidden>
      </div>
      <p id="settings-announcement" class="settings-announcement" role="status" aria-live="polite"></p>
      <p id="status" role="status" hidden></p>
      <div id="restaurants" class="restaurants" aria-label="현재 표시 중인 식당"></div>
      <section id="other-restaurants-section" class="other-restaurants-section" aria-label="선택하지 않은 식당">
        <div class="selection-divider">
          <div class="bulk-actions" role="group" aria-label="식당 일괄 선택">
            <button id="add-all-restaurants" class="bulk-action" type="button" aria-label="모두 추가" title="모두 추가" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 7 4-4 4 4M4 12l4-4 4 4"/></svg>
            </button>
            <button id="remove-all-restaurants" class="bulk-action" type="button" aria-label="모두 제거" title="모두 제거" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 4 4 4-4M4 9l4 4 4-4"/></svg>
            </button>
          </div>
        </div>
        <div id="other-restaurants" class="restaurants"></div>
      </section>
      <noscript>식단을 보려면 JavaScript를 활성화해 주세요.</noscript>
      <footer class="attribution">
        <span>made by <a href="https://github.com/cyansky99" target="_blank" rel="noopener noreferrer">cyansky</a></span>
        <a href="https://github.com/cyansky99/snu-menu-embed/issues/new" target="_blank" rel="noopener noreferrer" title="GitHub에서 건의·오류 제보 (로그인 필요)">건의·오류 제보</a>
        <span class="menu-sources">출처:
          <a id="cooperative-source" href="https://snuco.snu.ac.kr/foodmenu/" target="_blank" rel="noopener noreferrer" aria-label="생협 식당 메뉴 출처: 서울대학교 생활협동조합">생협</a>
          <span aria-hidden="true"> · </span>
          <a id="dormitory-source" href="https://snudorm.snu.ac.kr/foodmenu/" target="_blank" rel="noopener noreferrer" aria-label="아워홈 메뉴 출처: 관악학생생활관" title="아워홈 식단">관악학생생활관</a>
        </span>
      </footer>
    </main>
  </body>
</html>
