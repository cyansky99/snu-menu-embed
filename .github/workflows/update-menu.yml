name: Update and deploy cafeteria widget

on:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions cron uses UTC. These run at 00:00, 10:00, 14:00,
    # and 19:00 in Korea Standard Time (UTC+9).
    - cron: "0 1,5,10,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafeteria-widget-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch menus
        run: python scripts/fetch_menu.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "Menu data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Update cafeteria menus"
          git push

      - name: Prepare public site
        run: |
          mkdir -p dist/assets dist/data
          cp index.html settings.html dist/
          cp assets/*.js assets/*.css assets/*.svg dist/assets/
          cp -R assets/fonts dist/assets/
          cp data/menus.json dist/data/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: "dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
