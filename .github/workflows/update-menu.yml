name: Update and deploy cafeteria widget

on:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions cron uses UTC. These run at 00:00, 10:00, 14:00,
    # and 19:00 in Korea Standard Time (UTC+9).
    - cron: "0 1,5,10,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cafeteria-widget-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch menus
        if: github.event_name != 'push'
        run: python scripts/fetch_menu.py

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "Menu data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Update cafeteria menus"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
